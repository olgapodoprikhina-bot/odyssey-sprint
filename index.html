<script type="module" id="firebase-init">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, doc, setDoc, getDoc, onSnapshot }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAuC3AqNmYOR1hSD0WkN5V22vC7RIHzI6A",
    authDomain: "odyssey-sprint.firebaseapp.com",
    projectId: "odyssey-sprint",
    storageBucket: "odyssey-sprint.firebasestorage.app",
    messagingSenderId: "952634288843",
    appId: "1:952634288843:web:caf628e79a73f31c92c94e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const USER_DOC = 'users/olga';

  window.fbSave = async function(data) {
    try {
      await setDoc(doc(db, USER_DOC), data, { merge: true });
    } catch(e) { console.warn('fbSave error:', e); }
  };

  window.fbLoad = async function() {
    try {
      const snap = await getDoc(doc(db, USER_DOC));
      return snap.exists() ? snap.data() : null;
    } catch(e) { console.warn('fbLoad error:', e); return null; }
  };

  window.fbSubscribe = function(onChange) {
    return onSnapshot(doc(db, USER_DOC), snap => {
      if(snap.exists()) onChange(snap.data());
    }, e => console.warn('fbSubscribe error:', e));
  };

  console.log('Firebase initialized: odyssey-sprint');
</script>

// ── утиліта форматування дати ──
const fmtDate = ts => {
  const d = new Date(ts);
  return d.getDate() + "." + (d.getMonth() + 1) + "." + d.getFullYear();
};
const fmtShort = ts => {
  const d = new Date(ts);
  return d.getDate() + "." + (d.getMonth() + 1) + ".";
};
const addDays = (dateStr, n) => {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
};
const weekRange = (sprintStart, weekNum) => {
  if (!sprintStart) return "";
  return fmtShort(addDays(sprintStart, (weekNum - 1) * 7)) + "–" + fmtShort(addDays(sprintStart, weekNum * 7 - 1));
};
const sprintRange = sprintStart => {
  if (!sprintStart) return "";
  return fmtShort(sprintStart) + "–" + fmtShort(addDays(sprintStart, 20));
};

const IDB_NAME = "odyssey-dragon-images";
const IDB_STORE = "images";
function idbOpen() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE, {
      keyPath: "id"
    });
    req.onsuccess = e => res(e.target.result);
    req.onerror = rej;
  });
}
async function idbPut(img) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(img);
    tx.oncomplete = res;
    tx.onerror = rej;
  });
}
async function idbGet(id) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const req = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(id);
    req.onsuccess = e => res(e.target.result || null);
    req.onerror = rej;
  });
}
async function idbGetAll() {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const req = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).getAll();
    req.onsuccess = e => res(e.target.result || []);
    req.onerror = rej;
  });
}
async function idbDelete(id) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = res;
    tx.onerror = rej;
  });
}

      // на швидкому завантаженні сторінки синхронізація мовчки не увімкнеться.
      let tries = 0;
      while ((!window.fbLoad || !window.fbSubscribe) && tries < 50) {
        await new Promise(r => setTimeout(r, 100));
        tries++;
      }
      if (!window.fbLoad || !window.fbSubscribe) {
        console.warn('Firebase: не ініціалізувався за 5с — синхронізація вимкнена цього разу');
        return;
      }
      try {
        const remote = await window.fbLoad();
        if (remote && remote[SAVE_KEY] && remote._updatedAt) {
          // Використовуємо окремий ключ timestamp (не всередині JSON)
          const localTs = parseInt(localStorage.getItem(SAVE_KEY + "_ts") || "0");
          if (remote._updatedAt > localTs) {
            const s = JSON.parse(remote[SAVE_KEY]);
            // Перевіряємо новий день для Firebase-даних теж
            const today = new Date().toISOString().slice(0, 10);
            if (s.lastActiveDate && s.lastActiveDate !== today) {

              setG(s);
              console.log('Firebase: loaded newer data from cloud');
            }
          }
        }
      } catch (e) {
        console.warn('Firebase load error:', e);
      }

      // Підписка на live-зміни (інший пристрій)

        if (!remote || !remote[SAVE_KEY] || !remote._updatedAt) return;
        // Порівнюємо з нашим останнім збереженням
        const localTs = parseInt(localStorage.getItem(SAVE_KEY + "_ts") || "0");
        if (remote._updatedAt <= localTs) return; // наше власне або старіше — пропускаємо

          localStorage.setItem(SAVE_KEY + "_ts", String(remote._updatedAt));
          setG(s);
          console.log('Firebase: synced from another device, ts=' + remote._updatedAt);
        } catch (e) {

        const o = ctx.createOscillator();
        const gn = ctx.createGain();
        o.connect(gn);
        gn.connect(ctx.destination);
        o.frequency.value = freq;
        o.type = "sine";
        gn.gain.setValueAtTime(0, ctx.currentTime + delay);
        gn.gain.linearRampToValueAtTime(0.45, ctx.currentTime + delay + 0.04);
        gn.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.45);
